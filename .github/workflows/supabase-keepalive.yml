# Пинг Supabase раз в 2 дня, чтобы free-проект не был приостановлен за неактивность.
# Живёт в server/, копируется deploy.sh в dist/.github/workflows/ при каждом деплое
# (gh-pages — дефолтная ветка репо, scheduled-workflow запускается с неё).
# Ключ — публичный anon/publishable (он и так в бандле сайта), секретов тут нет.
name: supabase-keepalive
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          code=$(curl -s -o /tmp/resp -w "%{http_code}" \
            "https://rannbemiqklqlmegiqtd.supabase.co/rest/v1/workouts?select=id&limit=1" \
            -H "apikey: sb_publishable_qb8QzSgywZoOsq02fNjGOg__EuBjBcq" \
            -H "Authorization: Bearer sb_publishable_qb8QzSgywZoOsq02fNjGOg__EuBjBcq")
          echo "HTTP $code"; cat /tmp/resp; echo
          test "$code" = "200"
