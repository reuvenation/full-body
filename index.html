    <!-- ⛔️ САМОИСЦЕЛЕНИЕ ОТ ПРОТУХШЕЙ СТРАНИЦЫ (28.08.2026). Не удалять.
         Что случилось: `deploy.sh` пушит ветку целиком, поэтому после деплоя старые
         `assets/index-*.js` ИСЧЕЗАЮТ с сервера (проверено: все прежние отдают 404).
         Если service worker отдал сохранённый index.html от прошлой версии, страница
         тянет уже несуществующий файл → приложение не стартует → БЕЛЫЙ ЭКРАН, и так
         при каждом заходе, потому что кэш цел и обновляться ему незачем.
         Владелец просидел так полдня на двух телефонах, пока сайт «работал у всех».
         Ловим не по таймеру, а по ФАКТУ ошибки загрузки скрипта: таймер на медленной
         связи сбрасывал бы кэш у тех, у кого всё исправно, просто грузится долго. -->
    <script>
      (function () {
        var FLAG = 'fb_stale_recovered'
        function heal() {
          // лечимся один раз за вкладку, иначе при живом 404 получится вечный цикл
          if (sessionStorage.getItem(FLAG)) return
          sessionStorage.setItem(FLAG, '1')
          var jobs = []
          try {
            if (window.caches) jobs.push(caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k) }))
            }))
            if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister() }))
            }))
          } catch (e) { /* приватный режим и т. п. — просто перезагрузимся */ }
          var again = function () { location.reload() }
          Promise.all(jobs).then(again, again)
        }
        window.addEventListener('error', function (e) {
          var el = e && e.target
          if (!el || el === window) return
          var src = el.src || el.href || ''
          if (src.indexOf('/assets/') !== -1) heal()
        }, true)   // capture: ошибки загрузки ресурсов не всплывают
      })()
    </script>
